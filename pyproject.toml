[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "myrepo"
version = "0.0.1"
description = "Project code for NODE experiments"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Mariia Shapovalova" }]
requires-python = ">=3.9,<3.10"

# Keep core empty to avoid forcing new installs in existing pipelines.
# Install what you need via optional extras (below) or your environment.yml.
dependencies = []

[project.optional-dependencies]
# Plotting / viz
viz = [
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "plotly>=5.22",
]

# Data & analysis
analysis = [
  "pandas>=2.2",
  "scikit-learn>=1.3",
  "statsmodels>=0.14",
]

# Utilities
utils = [
  "rich>=13.7",
  "pyyaml>=6",
  "requests>=2.32",
  "tqdm>=4.66",
]

# Pyomo stack (solver binary still comes from conda-forge ipopt)
pyomo = [
  "pyomo>=6.7",
]

# Torch (CPU-only wheels will be picked when no CUDA is present)
torch = [
  "torch>=2.3",
  "torchdiffeq>=0.2.4",
]
torch-extras = [
  "torchvision",
  "torchaudio",
]

# JAX (CPU) — install only when you actually need it
jax-cpu = [
  "jax>=0.4.28",
  "jaxlib>=0.4.28",
  "diffrax>=0.6.0",
  "equinox>=0.11.4",
  "optax>=0.2.2",
  "chex>=0.1.86",
  "jaxtyping>=0.2.31",
  "flax>=0.8.4",  
]

# Optional compiled/solver libs — only if you really need them
optim = [
  "casadi>=3.6",
  "proxsuite>=0.6",
  # Prefer the ipopt binary from conda-forge in your environment.yml.
  # Add "cyipopt" here only if you specifically need the Python bindings.
]

[tool.setuptools]
package-dir = { "" = "src" }
[tool.setuptools.packages.find]
where = ["src"]
include = ["utils*", "utils_training*", "models*", "training_convergnce_studies*"]

