name: Pyomo Training HO (Single Job)

on:
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Micromamba
        uses: mamba-org/setup-micromamba@v1
        with:
          environment-file: environment.yml
          cache-environment: true
          cache-downloads: true

      - name: Install project (editable + extras)
        shell: "bash -l {0}"
        run: |
          python -m pip install -U pip setuptools wheel
          python -m pip install -e '.[pyomo,analysis,utils,torch,jax-cpu,optim]'

      - name: Run training
        shell: "bash -l {0}"
        run: |
          mkdir -p results/pyomo
          python -m training_convergence.training_convergence \
            --config config.json \
            --exp training_convergence_wall_time \
            --n_seeds 1

      - name: Upload results artifact
        uses: actions/upload-artifact@v4
        with:
          name: pyomo-results
          path: results/pyomo/*.pkl
          if-no-files-found: error
