name: Pyomo training (CPU)

on:
  workflow_dispatch: {}   # manual trigger

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6h job cap on GH-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Micromamba
        uses: mamba-org/setup-micromamba@v1
        with:
          environment-file: environment.yml
          cache-environment: true
          cache-downloads: true

      - name: Install project (editable)
        shell: bash -l {0}
        run: |
          python -m pip install -e .

      - name: Sanity check IPOPT
        shell: bash -l {0}
        run: |
          python - <<'PY'
from pyomo.opt import SolverFactory
print("IPOPT available:", bool(SolverFactory('ipopt')))
PY

      - name: Run training (1 seed)
        shell: bash -l {0}
        run: |
          python run_training.py --config config.json --exp training_convergence_wall_time --n_seeds 1 --outdir results/pyomo

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: pyomo-results
          path: results/pyomo/*.pkl
          if-no-files-found: error
